.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:999px;border:0;font-weight:600;font-size:14px;cursor:pointer}
.btn-primary{background:${l};color:#fff}
.btn-white{background:#fff;color:#000}
.card{background:#fff;border:1px solid #eee;border-radius:${u};padding:24px}
.count{display:flex;gap:8px;justify-content:center}.count>div{min-width:68px;background:#fff;color:#000;border-radius:12px;padding:12px 8px;text-align:center}
.timeline{border-left:2px solid ${l}22;padding-left:22px}.dot{width:12px;height:12px;border-radius:999px;background:#fff;border:2px solid ${l};position:absolute;left:-27px;top:2px}
.qr-box{width:128px;height:128px;border-radius:12px;background:#0a0a0a;color:#fff;display:grid;place-items:center;margin:12px auto}
input,select,textarea{width:100%;height:46px;padding:0 14px;border-radius:10px;border:1px solid #e5e5e5;background:#fafafa;font-size:14px}
textarea{height:96px;padding:12px 14px;resize:none}
@media(max-width:640px){.hero h1{font-size:34px}.count>div{min-width:56px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"><\/script>
</head>
<body>
<header class="hero">
  <img class="bg" src="${T(e.heroImage)}" alt=""/>
  <div class="shade"></div>
  <div style="position:relative;z-index:2;padding:56px 20px;${p}">
    <img src="${T(e.logo)}" style="width:84px;height:84px;border-radius:999px;object-fit:cover;border:3px solid rgba(255,255,255,.9);box-shadow:0 10px 30px rgba(0,0,0,.4)" alt="logo"/>
    <div style="margin-top:14px;font-size:11px;letter-spacing:.28em;text-transform:uppercase;opacity:.85">${T(e.slogan)}</div>
    <div class="badge" style="margin-top:18px">${T((Ua.find((h)=>h.id===e.eventType)?.label||"").toUpperCase())} ${e.showCapacity?`• SOLO ${e.capacity} LUGARES`:""}</div>
    <h1 class="inv" style="margin:18px auto 0;max-width:18ch;font-size:52px;line-height:.95;letter-spacing:-.02em;font-weight:800">${T(e.eventTitle)}</h1>
    <p style="max-width:46ch;margin:14px auto 0;opacity:.85;font-size:14px;line-height:1.6">${T(e.welcomeMsg.slice(0,220))}</p>
    <div style="margin-top:22px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
      <span class="btn btn-white">\uD83D\uDCC5 ${T(e.date)} • ${T(e.timeStart)}h</span>
      <a class="btn" style="background:rgba(0,0,0,.4);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.25);color:#fff" href="${T(e.mapsLink)}" target="_blank">\uD83D\uDCCD ${T(e.address.slice(0,36))}</a>
    </div>
    ${e.sections.countdown?'<div style="margin-top:28px"><div style="font-size:11px;letter-spacing:.2em;opacity:.7;margin-bottom:10px">FALTAN</div><div class="count" id="countdown"></div></div>':""}
    <div style="margin-top:24px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <a id="waTop" class="btn btn-primary" href="https://wa.me/${T(e.rsvp.whatsapp)}?text=${encodeURIComponent(e.rsvp.message)}" target="_blank">\uD83D\uDCAC Confirmar por WhatsApp</a>
      ${e.addCalendar?'<button class="btn btn-white" onclick="addToCalendar()">\uD83D\uDCC5 Agendar en Google Calendar</button>':""}
    </div>
  </div>
</header>

<main style="max-width:960px;margin:0 auto;padding:32px 20px;display:grid;gap:28px">
${e.sections.about?`<section class="card"><div style="font-size:11px;letter-spacing:.2em;opacity:.5;text-transform:uppercase">Sobre el lugar</div><h2 class="inv" style="margin:8px 0 0;font-size:24px;font-weight:700">${T(e.bizName)} desde ${T(e.foundedYear)}</h2><p style="margin:12px 0 0;font-size:14px;line-height:1.7;opacity:.8">${T(e.welcomeMsg)}</p><div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap"><span style="padding:6px 12px;border-radius:999px;background:${i};border:1px solid ${l}22;color:${l};font-size:11px">Cocina de autor</span><span style="padding:6px 12px;border-radius:999px;background:#f6f6f6;border:1px solid #eee;font-size:11px">Nueva terraza 120m²</span></div></section>`:""}

${e.sections.benefits?`<section><h3 class="inv" style="font-size:20px;font-weight:700">Lo que hemos preparado</h3><div style="margin-top:14px;display:grid;gap:10px">${e.benefits.map((h)=>`<div class="card" style="display:flex;gap:12px;align-items:flex-start"><div style="width:42px;height:42px;border-radius:10px;background:${i};display:grid;place-items:center;font-size:18px;flex-shrink:0">${T(h.icon)}</div><div><div style="font-size:13.5px;font-weight:600">${T(h.title)}</div><div style="font-size:12px;opacity:.6;margin-top:4px;line-height:1.4">${T(h.desc)}</div></div></div>`).join("")}</div></section>`:""}

${e.sections.gallery&&e.gallery.filter(Boolean).length?`<section><h3 class="inv" style="font-size:20px;font-weight:700">Instalaciones</h3><div style="margin-top:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${e.gallery.filter(Boolean).map((h)=>`<button onclick="openLB('${T(h)}')" style="aspect-ratio:4/3;overflow:hidden;border-radius:12px;border:0;padding:0"><img src="${T(h)}" style="width:100%;height:100%;object-fit:cover" alt=""/></button>`).join("")}</div></section>`:""}

${e.sections.menu?`<section class="card" style="background:${l};color:#fff;border-color:${l}"><div style="font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.6">Menú degustación — cortesía de la casa</div><h3 class="inv" style="margin:8px 0 0;font-size:20px;font-weight:700">Selección del Chef</h3><div style="margin-top:16px;display:grid;gap:14px">${e.menuItems.map((h)=>`<div style="display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid rgba(255,255,255,.12);padding-bottom:12px"><div><div style="font-weight:600;font-size:13.5px">${T(h.name)}</div><div style="opacity:.7;font-size:12px;margin-top:4px">${T(h.desc)}</div></div><span style="font-size:11px;padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.15);height:fit-content">${T(h.price)}</span></div>`).join("")}</div></section>`:""}

${e.sections.agenda?`<section><h3 class="inv" style="font-size:20px;font-weight:700">Agenda de la noche</h3><div class="timeline" style="margin-top:16px;position:relative;display:grid;gap:22px">${e.agenda.map((h)=>`<div style="position:relative"><div class="dot"></div><div style="font-size:11px;font-weight:700;color:${l}">${T(h.time)}</div><div style="font-weight:600;margin-top:4px;font-size:13.5px">${T(h.title)}</div><div style="font-size:12px;opacity:.6">${T(h.desc)}</div></div>`).join("")}</div></section>`:""}

<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
${e.sections.dress&&e.dressCode!=="none"?`<div class="card" style="display:flex;gap:12px;align-items:center"><div style="width:40px;height:40px;border-radius:10px;background:${i};display:grid;place-items:center">\uD83D\uDC54</div><div><div style="font-size:11px;opacity:.5;text-transform:uppercase">Vestimenta</div><div style="font-weight:600;text-transform:capitalize">${T(e.dressCode)}</div></div></div>`:""}
${e.sections.practical?`<div class="card" style="font-size:12px;display:grid;gap:6px">${e.practical.parking?"\uD83C\uDD7F️ Estacionamiento<br/>":""}${e.practical.valet?"\uD83D\uDE97 Valet parking<br/>":""}\uD83D\uDCCD ${T(e.address)}</div>`:""}
</div>

${e.sections.map?`<section class="card" style="padding:0;overflow:hidden"><div style="padding:16px;display:flex;justify-content:space-between;align-items:center;gap:12px"><div><div style="font-weight:600;font-size:13px">\uD83D\uDCCD ${T(e.address)}</div><div style="font-size:11px;opacity:.5;margin-top:4px">${T(e.date)} • ${T(e.timeStart)}-${T(e.timeEnd)}</div></div><a class="btn btn-primary" style="height:36px;font-size:12px" href="${T(e.mapsLink)}" target="_blank">Abrir Maps</a></div><div style="height:200px;background:#f1f1f1;display:grid;place-items:center;font-size:12px;color:#888">Mapa — <a href="${T(e.mapsLink)}" target="_blank" style="text-decoration:underline">Ver en Google Maps</a> • <a href="https://waze.com/ul?q=${encodeURIComponent(e.address)}" target="_blank" style="text-decoration:underline">Abrir Waze</a></div></section>`:""}

${e.sections.coupon?`<section class="card" style="text-align:center;border:2px dashed ${l}"><div style="font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.5">Cupón inauguración</div><div style="margin:10px auto 0;display:inline-block;padding:10px 18px;border-radius:999px;background:#000;color:#fff;font-family:monospace;font-size:18px;letter-spacing:.12em">${T(e.coupon.code)}</div><div style="font-weight:600;margin-top:8px;font-size:13px">${T(e.coupon.discount)}</div><div style="font-size:11px;opacity:.6">${T(e.coupon.valid)}</div></section>`:""}

${e.sections.rsvp?`<section class="card"><h3 class="inv" style="font-size:20px;font-weight:700">Confirma tu asistencia</h3><p style="font-size:12px;opacity:.6;margin-top:4px">Cupo limitado a ${e.capacity} personas</p>
<form id="rsvpForm" style="margin-top:16px;display:grid;gap:10px" onsubmit="return submitRSVP(event)">
<input id="f_nombre" required placeholder="Nombre completo *"/>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><input id="f_empresa" placeholder="Empresa"/><select id="f_acom"><option value="1">1 persona</option><option value="2">2 personas</option><option value="3">3 personas</option><option value="4">4 personas</option></select></div>
<input id="f_wa" placeholder="WhatsApp"/>
<button class="btn btn-primary" style="width:100%" type="submit">\uD83D\uDCAC Confirmar por WhatsApp</button>
<div style="display:flex;gap:8px"><button type="button" class="btn" style="flex:1;border:1px solid #ddd;background:#fff" onclick="addToCalendar()">\uD83D\uDCC5 Calendar</button><button type="button" class="btn" style="flex:1;border:1px solid #ddd;background:#fff" onclick="genQR()">\uD83C\uDF9F️ QR VIP</button></div>
<div id="qr" class="qr-box" style="display:none"></div>
<div id="ok" style="display:none;padding:12px;border-radius:10px;background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;font-size:12px">¡Gracias! Tu confirmación fue enviada. Te contactaremos por WhatsApp.</div>
</form></section>`:""}

${e.branding?`<div style="text-align:center;padding:18px 0 8px;border-top:1px solid #eee;font-size:10px;letter-spacing:.15em;opacity:.4;text-transform:uppercase">${T(e.bizName)} • ${T(e.slogan)}<br/><br/>Hecho con ❤️ AnálisisPro — Invitaciones Digitales PYMES</div>`:""}
</main>

<div id="lb" style="display:none;position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.85);place-items:center;padding:24px" onclick="this.style.display='none'"><img id="lbImg" style="max-width:100%;max-height:84vh;border-radius:16px" alt=""/></div>

<script>
var targetDate = new Date('${T(e.date)}T${T(e.timeStart)}:00').getTime();
function tick(){
  var now=Date.now(); var diff=Math.max(0,targetDate-now);
  var d=Math.floor(diff/86400000), h=Math.floor(diff/3600000)%24, m=Math.floor(diff/60000)%60, s=Math.floor(diff/1000)%60;
  var el=document.getElementById('countdown'); if(!el) return;
  el.innerHTML='<div><div style="font-size:20px;font-weight:800">'+String(d).padStart(2,'0')+'</div><div style="font-size:9px;letter-spacing:.18em;opacity:.6">DÍAS</div></div><div><div style="font-size:20px;font-weight:800">'+String(h).padStart(2,'0')+'</div><div style="font-size:9px;letter-spacing:.18em;opacity:.6">HRS</div></div><div><div style="font-size:20px;font-weight:800">'+String(m).padStart(2,'0')+'</div><div style="font-size:9px;letter-spacing:.18em;opacity:.6">MIN</div></div><div><div style="font-size:20px;font-weight:800">'+String(s).padStart(2,'0')+'</div><div style="font-size:9px;letter-spacing:.18em;opacity:.6">SEG</div></div>';
}
setInterval(tick,1000); tick();

function openLB(src){ var lb=document.getElementById('lb'); var img=document.getElementById('lbImg'); img.src=src; lb.style.display='grid'; }
function genQR(){
  var box=document.getElementById('qr'); box.style.display='grid'; box.innerHTML='';
  var txt='${T(e.qr.text)} - '+document.getElementById('f_nombre').value+' - ${T(t)}';
  new QRCode(box,{text:txt,width:112,height:112,colorDark:'#ffffff',colorLight:'#0a0a0a'});
}
function addToCalendar(){
  var title=encodeURIComponent('${T(e.eventTitle)} - ${T(e.bizName)}');
  var details=encodeURIComponent('${T(e.welcomeMsg.slice(0,120))}');
  var loc=encodeURIComponent('${T(e.address)}');
  var dt='${T(e.date.replace(/-/g,""))}T${T(e.timeStart.replace(":",""))}00/${T(e.date.replace(/-/g,""))}T${T(e.timeEnd.replace(":",""))}00';
  window.open('https://calendar.google.com/calendar/render?action=TEMPLATE&text='+title+'&details='+details+'&location='+loc+'&dates='+dt,'_blank');
}
function submitRSVP(e){
  e.preventDefault();
  var nombre=document.getElementById('f_nombre').value;
  var empresa=document.getElementById('f_empresa').value;
  var acom=document.getElementById('f_acom').value;
  var wa=document.getElementById('f_wa').value;
  var waNumber='${T(e.rsvp.whatsapp)}';
  var msg='${T(e.rsvp.message)}'.replace('{nombre}',nombre);
  var waUrl='https://wa.me/'+waNumber+'?text='+encodeURIComponent(msg+'\\nEmpresa:'+empresa+' Acomp:'+acom);
  ${e.rsvp.sheetUrl?`
  var sheetUrl='${T(e.rsvp.sheetUrl)}';
  fetch(sheetUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({timestamp:new Date().toISOString(),nombre:nombre,empresa:empresa,acompanantes:acom,whatsapp:wa,evento_slug:'${T(t)}',codigo_cupon:'${T(e.coupon.code)}'})});
  `:""}
  document.getElementById('ok').style.display='block';
  ${e.qr.enabled?"genQR();":""}
  setTimeout(function(){ window.open(waUrl,'_blank'); }, 400);
  return false;
}
<\/script>
</body>
</html>`}function T(e){return(e||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}Rd.createRoot(document.getElementById("root")).render(s(Fd.default.StrictMode,{children:s(Ba,{})}));
</script>
  <script>(function(){function m(a){var h=a.getAttribute("href");if(!h)return;try{var u=new URL(h,document.baseURI);if((u.protocol==="http:"||u.protocol==="https:")&&u.host!==location.host){a.target="_blank";a.rel="noopener noreferrer";}}catch(e){}}function s(){document.querySelectorAll("a[href]").forEach(m);}if(document.readyState!=="loading"){s();}else{document.addEventListener("DOMContentLoaded",s);}document.addEventListener("click",function(e){var a=e.target&&e.target.closest&&e.target.closest("a[href]");if(a){m(a);}},true);})();</script>
  
</body>
</html>
